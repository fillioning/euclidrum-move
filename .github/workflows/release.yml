name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect default branch
        run: |
          BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          echo "DEFAULT_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Sync module.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          python3 - "$VERSION" <<'PYEOF'
          import json, sys, pathlib
          version = sys.argv[1]
          for p in ("module.json", "src/module.json"):
              path = pathlib.Path(p)
              if not path.exists():
                  continue
              data = json.loads(path.read_text())
              data["version"] = version
              path.write_text(json.dumps(data) + "\n")
              print(f"  {p}: version -> {version}")
          PYEOF

      - uses: docker/setup-buildx-action@v3

      - name: Build module
        run: |
          docker build -t schwung-builder -f Dockerfile .
          CONTAINER_ID=$(docker create -w /build schwung-builder bash -c "\
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates && \
            git clone --depth 1 https://github.com/charlesvestal/schwung.git /tmp/schwung && \
            SCHWUNG_SRC=/tmp/schwung/src bash build-module.sh && \
            cd dist && tar -czvf euclidrum-module.tar.gz euclidrum/")
          docker cp euclidrum.c "$CONTAINER_ID:/build/euclidrum.c"
          docker cp module.json "$CONTAINER_ID:/build/module.json"
          if [ -f help.json ]; then docker cp help.json "$CONTAINER_ID:/build/help.json"; fi
          docker cp build-module.sh "$CONTAINER_ID:/build/build-module.sh"
          docker start -a "$CONTAINER_ID"
          mkdir -p dist
          docker cp "$CONTAINER_ID:/build/dist/euclidrum-module.tar.gz" dist/euclidrum-module.tar.gz
          docker rm "$CONTAINER_ID"

      - uses: softprops/action-gh-release@v1
        with:
          files: dist/euclidrum-module.tar.gz

      - name: Update release.json on default branch
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          REPO=${{ github.repository }}
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -f "$DEFAULT_BRANCH"
          # Regenerate release.json AFTER checking out the default branch so the
          # change actually lands on it (previous flow generated the file at the
          # tag and then discarded it via the subsequent checkout).
          cat > release.json <<EOFJ
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${REPO}/releases/download/v${VERSION}/euclidrum-module.tar.gz"
          }
          EOFJ
          # Also sync module.json versions on the default branch so the tree
          # stays consistent with what was tagged.
          python3 - "$VERSION" <<'PYEOF'
          import json, sys, pathlib
          version = sys.argv[1]
          for p in ("module.json", "src/module.json"):
              path = pathlib.Path(p)
              if not path.exists():
                  continue
              data = json.loads(path.read_text())
              data["version"] = version
              path.write_text(json.dumps(data) + "\n")
          PYEOF
          git add release.json module.json src/module.json
          if git diff --cached --quiet; then
            echo "No changes on $DEFAULT_BRANCH"
          else
            git commit -m "Sync release.json + module.json for v${VERSION}"
            git push origin "$DEFAULT_BRANCH"
          fi
